services:
  # Python FastAPI Machine Learning Backend Web Service
  - type: web
    name: credit-risk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_BUNDLE_PATH
        value: models/credit_risk_bundle.joblib
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"
        sync: false

  # React + Vite Static Frontend Site
  - type: web
    name: credit-risk-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
